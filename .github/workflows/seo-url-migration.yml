name: One-time Vercel URL SEO migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Replace old production URL and remove this workflow
        shell: bash
        run: |
          set -e
          OLD='https://nextborder.netlify.app'
          NEW='https://next-border.vercel.app'
          git grep -Il "$OLD" -- . ':!/.git/*' | while IFS= read -r file; do
            sed -i "s#${OLD}#${NEW}#g" "$file"
          done
          rm -f .github/workflows/seo-url-migration.yml

      - name: Commit migration
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No SEO URL changes required.'
            exit 0
          fi
          git commit -m 'Migrate SEO URLs from Netlify to Vercel'
          git push